{% extends 'base.html' %}

{% block title %}Logged Out{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title mb-4">Successfully Logged Out</h2>
                    <p class="card-text">
                        Thanks for spending some quality time with our blog platform today.
                    </p>
                    <div class="mt-4">
                        <a href="{% url 'home' %}" class="btn btn-primary me-2">
                            <i class="bi bi-house"></i> Go to Home
                        </a>
                        <a href="{% url 'login' %}" class="btn btn-outline-primary">
                            <i class="bi bi-box-arrow-in-right"></i> Log in Again
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

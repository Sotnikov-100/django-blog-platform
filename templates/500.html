{% extends 'base.html' %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="error-page">
                <h1 class="display-1 text-muted">500</h1>
                <h2 class="mb-4">Server Error</h2>
                <p class="lead mb-4">Sorry, an internal server error occurred. Please try again later.</p>
                <a href="{% url 'article-list' %}" class="btn btn-primary">Return to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
